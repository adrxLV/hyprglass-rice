# Generated by Tide Island. Edit shortcuts in the Tide Island config app.
# These binds call Quickshell IPC; the same commands can be reused in scripts.
# Island command: island toggle.
bind = SUPER ALT, TAB, exec, /usr/bin/quickshell ipc --any-display -p /usr/share/tide-island call overview toggle
bind = SUPER, right, exec, /usr/bin/quickshell ipc --any-display -p /usr/share/tide-island call tide swipeRight
bind = SUPER, left, exec, /usr/bin/quickshell ipc --any-display -p /usr/share/tide-island call tide swipeLeft
bind = SUPER, down, exec, /usr/bin/quickshell ipc --any-display -p /usr/share/tide-island call tide showClock
bind = SUPER, M, exec, /usr/bin/quickshell ipc --any-display -p /usr/share/tide-island call tide togglePlayer
bind = SUPER, C, exec, /usr/bin/quickshell ipc --any-display -p /usr/share/tide-island call tide toggleControlCenter
bind = SUPER, N, exec, /usr/bin/quickshell ipc --any-display -p /usr/share/tide-island call tide toggleNotificationCenter
bind = SUPER, W, exec, /usr/bin/quickshell ipc --any-display -p /usr/share/tide-island call tide toggleWallpaperPicker
bind = SUPER, D, exec, /usr/bin/quickshell ipc --any-display -p /usr/share/tide-island call tide toggleApplicationLauncher
bind = SUPER, F, exec, /usr/bin/quickshell ipc --any-display -p /usr/share/tide-island call island toggle
